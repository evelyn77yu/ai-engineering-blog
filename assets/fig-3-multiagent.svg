<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 404" width="940" height="404" role="img" aria-label="从单 Agent 拆分到 Multi-Agent 的触发信号">
  <defs>
    <marker id="m1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94A3B8"/>
    </marker>
  </defs>
  <rect width="940" height="404" fill="#FFFFFF"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Hiragino Sans GB', Arial, sans-serif">
    <text x="30" y="40" font-size="20" font-weight="700" fill="#0F172A">什么时候才应该从单 Agent 拆到 Multi-Agent</text>
    <text x="30" y="64" font-size="12.5" fill="#64748B">拆分依据是职责是否冲突，不是任务是否复杂</text>

    <rect x="30" y="92" width="256" height="172" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="50" y="118" font-size="13" font-weight="700" fill="#0F172A">默认形态：单 Agent</text>
    <text x="50" y="146" font-size="11.5" fill="#475569">· 上下文共享，无交接损耗</text>
    <text x="50" y="170" font-size="11.5" fill="#475569">· 工具数量可控时最稳</text>
    <text x="50" y="194" font-size="11.5" fill="#475569">· 成本与调试复杂度最低</text>
    <text x="50" y="228" font-size="11.5" font-weight="600" fill="#0F766E">先穷尽单 Agent + 工具化的空间</text>
    <text x="50" y="248" font-size="11.5" fill="#64748B">大多数需求停在这一层就够了</text>

    <rect x="342" y="92" width="256" height="172" rx="10" fill="#FFFBF5" stroke="#F6DEB8"/>
    <text x="362" y="118" font-size="13" font-weight="700" fill="#0F172A">拆分信号（三条）</text>
    <text x="362" y="146" font-size="11.5" fill="#475569">① 同一上下文里出现互相冲突的目标</text>
    <text x="362" y="170" font-size="11.5" fill="#475569">② 生成方与校验方需要独立视角</text>
    <text x="362" y="194" font-size="11.5" fill="#475569">③ 角色间的输入输出契约可被明确定义</text>
    <text x="362" y="228" font-size="11.5" fill="#64748B">三条同时成立才拆。只有 ① 应优先尝试</text>
    <text x="362" y="248" font-size="11.5" fill="#64748B">改工具接口或拆流程，而不是拆 Agent。</text>

    <rect x="654" y="92" width="256" height="172" rx="10" fill="#EEF4FF" stroke="#BFD6F6"/>
    <text x="674" y="118" font-size="13" font-weight="700" fill="#0F172A">拆分之后</text>
    <text x="674" y="146" font-size="11.5" fill="#475569">· 角色数量克制，避免"为拆而拆"</text>
    <text x="674" y="170" font-size="11.5" fill="#475569">· 交接内容结构化，而非自然语言转述</text>
    <text x="674" y="194" font-size="11.5" fill="#475569">· 每个角色的审查记录独立留存</text>
    <text x="674" y="228" font-size="11.5" font-weight="600" fill="#1D4ED8">代价：一致性与可观测性下降</text>
    <text x="674" y="248" font-size="11.5" fill="#64748B">因此拆分必须有可验证的收益支撑</text>

    <line x1="292" y1="178" x2="336" y2="178" stroke="#94A3B8" stroke-width="2" marker-end="url(#m1)"/>
    <line x1="604" y1="178" x2="648" y2="178" stroke="#94A3B8" stroke-width="2" marker-end="url(#m1)"/>

    <rect x="30" y="288" width="880" height="88" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="50" y="314" font-size="12.5" font-weight="700" fill="#0F172A">在这套判断里最容易走反的一步</text>
    <text x="50" y="338" font-size="12" fill="#3F3F46">把"任务变多了"当成"该拆 Agent 了"。任务多应该先拆工具与流程：一个 Agent 可以调用 20 个工具，</text>
    <text x="50" y="358" font-size="12" fill="#3F3F46">但两个 Agent 共享一个状态就要付出交接、对账与一致性代价。<b>Multi-Agent 解决的是职责冲突，不是工作量。</b></text>
  </g>
</svg>
