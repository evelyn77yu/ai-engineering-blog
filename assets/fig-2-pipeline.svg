<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 432" width="940" height="432" role="img" aria-label="评测流水线与可验证性设计">
  <defs>
    <marker id="p1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94A3B8"/>
    </marker>
  </defs>
  <rect width="940" height="432" fill="#FFFFFF"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Hiragino Sans GB', Arial, sans-serif">
    <text x="30" y="40" font-size="20" font-weight="700" fill="#0F172A">一次对照评测的流水线：先控制变量，再谈分数</text>
    <text x="30" y="64" font-size="12.5" fill="#64748B">同一模型 · 40 题 · 四种策略 · 320 次调用 —— 每一步都留下可被第三方复核的证据</text>

    <!-- stage boxes -->
    <rect x="12" y="96" width="172" height="92" rx="9" fill="#EEF4FF" stroke="#BFD6F6"/>
    <text x="98" y="126" font-size="12.5" font-weight="700" fill="#0F172A" text-anchor="middle">1　固定变量</text>
    <text x="98" y="150" font-size="11.5" fill="#475569" text-anchor="middle">模型 / 温度 / 调用次数</text>
    <text x="98" y="168" font-size="11.5" fill="#475569" text-anchor="middle">示例与数据集边界</text>

    <rect x="199" y="96" width="172" height="92" rx="9" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="285" y="126" font-size="12.5" font-weight="700" fill="#0F172A" text-anchor="middle">2　采样留痕</text>
    <text x="285" y="150" font-size="11.5" fill="#475569" text-anchor="middle">逐题记录原始输出</text>
    <text x="285" y="168" font-size="11.5" fill="#475569" text-anchor="middle">投票分布一并归档</text>

    <rect x="386" y="96" width="172" height="92" rx="9" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="472" y="126" font-size="12.5" font-weight="700" fill="#0F172A" text-anchor="middle">3　提取与归一化</text>
    <text x="472" y="150" font-size="11.5" fill="#475569" text-anchor="middle">统一答案提取规则</text>
    <text x="472" y="168" font-size="11.5" fill="#475569" text-anchor="middle">严格 / 宽松双轨评分</text>

    <rect x="573" y="96" width="172" height="92" rx="9" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="659" y="126" font-size="12.5" font-weight="700" fill="#0F172A" text-anchor="middle">4　汇总与归因</text>
    <text x="659" y="150" font-size="11.5" fill="#475569" text-anchor="middle">分任务类别统计</text>
    <text x="659" y="168" font-size="11.5" fill="#475569" text-anchor="middle">错误案例逐条回看</text>

    <rect x="760" y="96" width="170" height="92" rx="9" fill="#F0FBF6" stroke="#B7E4CE"/>
    <text x="845" y="126" font-size="12.5" font-weight="700" fill="#0F172A" text-anchor="middle">5　可验证性</text>
    <text x="845" y="150" font-size="11.5" fill="#475569" text-anchor="middle">离线脚本 / CI / 哈希</text>
    <text x="845" y="168" font-size="11.5" fill="#475569" text-anchor="middle">重跑不覆盖历史</text>

    <line x1="186" y1="142" x2="196" y2="142" stroke="#94A3B8" stroke-width="2" marker-end="url(#p1)"/>
    <line x1="373" y1="142" x2="383" y2="142" stroke="#94A3B8" stroke-width="2" marker-end="url(#p1)"/>
    <line x1="560" y1="142" x2="570" y2="142" stroke="#94A3B8" stroke-width="2" marker-end="url(#p1)"/>
    <line x1="747" y1="142" x2="757" y2="142" stroke="#94A3B8" stroke-width="2" marker-end="url(#p1)"/>

    <!-- three verification cards -->
    <rect x="30" y="216" width="286" height="118" rx="9" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="48" y="242" font-size="12.5" font-weight="600" fill="#0F172A">离线验证脚本</text>
    <text x="48" y="264" font-size="11.5" fill="#475569">不调用任何 API，只核查归档结果的</text>
    <text x="48" y="282" font-size="11.5" fill="#475569">内部一致性：题目覆盖、答案提取、</text>
    <text x="48" y="300" font-size="11.5" fill="#475569">评分标记、投票、汇总是否自洽。</text>
    <text x="48" y="322" font-size="11.5" fill="#B45309">让验证的门槛降到零成本</text>

    <rect x="327" y="216" width="286" height="118" rx="9" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="345" y="242" font-size="12.5" font-weight="600" fill="#0F172A">CI 质量门</text>
    <text x="345" y="264" font-size="11.5" fill="#475569">同一个脚本在每次 push / PR 时执行，</text>
    <text x="345" y="282" font-size="11.5" fill="#475569">确认归档结果没有被整理动作意外改坏。</text>
    <text x="345" y="302" font-size="11.5" fill="#475569">评测项目尤其需要：整理文件最容易</text>
    <text x="345" y="322" font-size="11.5" fill="#B45309">动到结果文件本身</text>

    <rect x="624" y="216" width="286" height="118" rx="9" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="642" y="242" font-size="12.5" font-weight="600" fill="#0F172A">来源哈希与历史隔离</text>
    <text x="642" y="264" font-size="11.5" fill="#475569">重跑写入独立时间戳目录，不覆盖历史；</text>
    <text x="642" y="282" font-size="11.5" fill="#475569">文件来源、大小与 SHA-256 记入清单。</text>
    <text x="642" y="302" font-size="11.5" fill="#475569">「未改写数据」这类声明必须可检验。</text>
    <text x="642" y="322" font-size="11.5" fill="#B45309">口头保证在工程里不算证据</text>

    <!-- caveat -->
    <rect x="30" y="354" width="880" height="60" rx="9" fill="#FFFBF5" stroke="#F6DEB8"/>
    <text x="50" y="378" font-size="12" fill="#92400E"><tspan font-weight="700">局限要先说清楚：</tspan>40 题规模下每题约占总体 2.5 个百分点，95% 与 92.5% 只差一题；四种策略的温度与调用次数并不相同，</text>
    <text x="50" y="398" font-size="12" fill="#92400E">不构成等计算成本比较。方法论可以复用，这批数据上的具体结论不能迁移。</text>
  </g>
</svg>
