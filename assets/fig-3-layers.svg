<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 392" width="940" height="392" role="img" aria-label="Agent 系统的三层职责划分">
  <rect width="940" height="392" fill="#FFFFFF"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Hiragino Sans GB', Arial, sans-serif">
    <text x="30" y="40" font-size="20" font-weight="700" fill="#0F172A">三层职责划分：每一层只做自己能判定的事</text>
    <text x="30" y="64" font-size="12.5" fill="#64748B">把不确定性留在模型层，把确定性交给工具层，把责任留给人工层</text>

    <rect x="30" y="90" width="880" height="86" rx="10" fill="#FFF7F3" stroke="#F3C9B6"/>
    <line x1="300" y1="104" x2="300" y2="162" stroke="#F3C9B6"/>
    <line x1="646" y1="104" x2="646" y2="162" stroke="#F3C9B6"/>
    <text x="52" y="124" font-size="13.5" font-weight="700" fill="#0F172A">① LLM 决策层</text>
    <text x="52" y="146" font-size="11.5" fill="#A16207">负责语义理解与规划</text>
    <text x="322" y="124" font-size="12.5" fill="#334155">规划分解 · 路由选择 · 结果表述</text>
    <text x="322" y="146" font-size="11.5" fill="#64748B">输出的是"下一步做什么"，不是"结果是什么"</text>
    <text x="670" y="124" font-size="12" fill="#B45309">不承担：确定性计算</text>
    <text x="670" y="146" font-size="11.5" fill="#64748B">同一输入多次调用可能不一致</text>

    <rect x="30" y="186" width="880" height="86" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/>
    <line x1="300" y1="200" x2="300" y2="258" stroke="#E2E8F0"/>
    <line x1="646" y1="200" x2="646" y2="258" stroke="#E2E8F0"/>
    <text x="52" y="220" font-size="13.5" font-weight="700" fill="#0F172A">② 确定性工具层</text>
    <text x="52" y="242" font-size="11.5" fill="#475569">负责可重放的执行与校验</text>
    <text x="322" y="220" font-size="12.5" fill="#334155">结构化工具调用 · 规则校验 · 结果比对</text>
    <text x="322" y="242" font-size="11.5" fill="#64748B">定义完整的错误类型、超时、可重试性与回滚</text>
    <text x="670" y="220" font-size="12" fill="#475569">不承担：价值判断</text>
    <text x="670" y="242" font-size="11.5" fill="#64748B">不知道"该不该做"，只知道"能不能做"</text>

    <rect x="30" y="282" width="880" height="86" rx="10" fill="#EEF4FF" stroke="#BFD6F6"/>
    <line x1="300" y1="296" x2="300" y2="354" stroke="#BFD6F6"/>
    <line x1="646" y1="296" x2="646" y2="354" stroke="#BFD6F6"/>
    <text x="52" y="316" font-size="13.5" font-weight="700" fill="#0F172A">③ 人工审查层</text>
    <text x="52" y="338" font-size="11.5" fill="#1D4ED8">负责放行与责任归属</text>
    <text x="322" y="316" font-size="12.5" fill="#334155">关键节点放行 · 分歧裁决 · 异常兜底</text>
    <text x="322" y="338" font-size="11.5" fill="#64748B">只保留真正需要判断力的检查点，不做逐条复核</text>
    <text x="670" y="316" font-size="12" fill="#1D4ED8">不承担：重复劳动</text>
    <text x="670" y="338" font-size="11.5" fill="#64748B">人被用成人工流水线，系统就退化回自动化前</text>
  </g>
</svg>
